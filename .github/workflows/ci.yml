name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Verify frontmatter + used-keywords
        run: pnpm verify

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Upload prerendered HTML for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerendered-html
          path: .output/public/**/*.html
          if-no-files-found: warn
          retention-days: 7
