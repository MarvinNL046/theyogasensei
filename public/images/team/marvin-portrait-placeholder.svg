<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="Portrait placeholder — Marvin Smit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe7dc"/>
      <stop offset="100%" stop-color="#e6ded3"/>
    </linearGradient>
  </defs>
  <rect width="480" height="480" fill="url(#bg)"/>
  <!-- enso-style circle echo of the brand mark -->
  <circle cx="240" cy="220" r="92" fill="none" stroke="#3f4a35" stroke-width="2" stroke-opacity="0.18" stroke-dasharray="2 6"/>
  <!-- silhouette head + shoulders -->
  <g fill="#3f4a35" fill-opacity="0.32">
    <circle cx="240" cy="200" r="46"/>
    <path d="M148 360 C148 300 188 268 240 268 C292 268 332 300 332 360 L332 392 L148 392 Z"/>
  </g>
  <!-- caption -->
  <text x="240" y="438" text-anchor="middle"
        font-family="'Cormorant Garamond', 'Lora', Georgia, serif"
        font-size="18" font-style="italic" fill="#6e6a64">
    portrait — coming soon
  </text>
</svg>
